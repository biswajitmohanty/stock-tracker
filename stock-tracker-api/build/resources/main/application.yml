server:
  port: 8080

spring:
  application:
    name: stock-tracker-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:mem:stock;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

app:
  cors:
    allowed-origins: "http://localhost:3000"
  markets:
    iex-token: "demo"
    alpha-vantage-key: "demo"
